name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Generate the snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Praveenchoudari01
          outputs: |
            ./output/github-contribution-grid-snake.svg

      - name: Commit and push to output branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout --orphan output
          git reset --hard
          mkdir -p output
          mv output/github-contribution-grid-snake.svg .
          git add github-contribution-grid-snake.svg
          git commit -m "Generated snake animation"
          git push -f origin output
