name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate the snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Praveenchoudari01
          outputs: |
            ./output/github-contribution-grid-snake.svg

      - name: Move the generated file to root (optional)
        run: mv ./output/github-contribution-grid-snake.svg ./github-contribution-grid-snake.svg

      - name: Commit and push the generated snake
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions
          author_email: github-actions@github.com
          message: "Generate snake animation"
          add: 'github-contribution-grid-snake.svg'
